version: 2
updates:
  # Routine upgrades are reviewed manually; keep main as the resting branch.
  # Zero pauses version PRs, not separately configured security updates.
  - package-ecosystem: npm
    directory: /dependencies/vortex-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "[skip ci]"
