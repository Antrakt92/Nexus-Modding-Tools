version: 2
updates:
  # Keep version proposals visible; review compatibility and source pins locally.
  - package-ecosystem: npm
    directory: /dependencies/vortex-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "[skip ci]"
